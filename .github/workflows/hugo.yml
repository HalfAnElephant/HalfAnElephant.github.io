# Isolated acceptance driver
name: Elephant acceptance bot PR driver
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Dedicated elephant-acceptance branch
        required: true
        type: string
      expected_head:
        description: Exact expected commit SHA
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
jobs:
  create-bot-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target and create only the test PR
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, re, urllib.parse, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          branch, expected = os.environ["TARGET_BRANCH"], os.environ["EXPECTED_HEAD"]
          if repo.casefold() != "halfanelephant/halfanelephant.github.io" or not branch.startswith("elephant-acceptance/") or not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("invalid acceptance target")
          def api(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request("https://api.github.com/repos/" + repo + "/" + path, data=data,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          head = api("commits/" + urllib.parse.quote(branch, safe=""))
          if head["sha"] != expected:
              raise SystemExit("acceptance head changed")
          base = 'elephant-acceptance/20261110T052854-9a0d4d-base'
          created = api("pulls", {"title": "[Elephant acceptance] Bot-authored approval target", "head": branch, "base": base,
              "body": "Temporary test-only PR created by the safe acceptance workflow. Do not merge. No deployment."})
          print(json.dumps({"number": created["number"], "url": created["html_url"], "author": created["user"]["login"]}))
          PYTHON
